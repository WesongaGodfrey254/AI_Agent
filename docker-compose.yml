services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sta_ai
      POSTGRES_PASSWORD: sta_ai
      POSTGRES_DB: sta_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sta_ai -d sta_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Compose the database is reachable at the "db" hostname.
      DATABASE_URL: postgresql://sta_ai:sta_ai@db:5432/sta_ai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
