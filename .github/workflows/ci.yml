name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py voice_app.py agent.py db_schema.py

      - name: FastAPI import smoke test
        env:
          GOOGLE_API_KEY: ci-placeholder-key
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          python - <<'PY'
          from app import app

          paths = {route.path for route in app.routes}
          expected = {
              "/",
              "/api/health",
              "/api/auth/config",
              "/api/conversations",
              "/api/chat",
          }
          missing = expected - paths
          assert not missing, f"Missing routes: {sorted(missing)}"
          print("FastAPI app imported; essential routes are present")
          PY

      - name: Guard against committed secrets
        run: |
          tracked_env=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::Tracked environment file(s): $tracked_env"
            exit 1
          fi

          if git grep -nIE '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,})' -- . ':(exclude).env.example'; then
            echo "::error::Possible credential found in tracked files"
            exit 1
          fi

          echo "No tracked .env files or obvious credentials found"
